[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "funseek"
version = "0.1.7"
description = "Find the Python function that does X, without knowing its name or where it resides."
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
dependencies = [
    "chromadb>=1.5.9",
    "google-genai>=2.29.0",
    "keyring>=25.7.0",
    "networkx>=3.7",
    "ollama>=0.6.3",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.1.0",
    "typer>=0.27.3",
]

[project.urls]
Homepage = "https://github.com/GovindhKishore/funseek"
Source = "https://github.com/GovindhKishore/funseek"
Tracker = "https://github.com/GovindhKishore/funseek/issues"

[project.scripts]
fun = "funseek.cli:app"
funseek = "funseek.cli:app"